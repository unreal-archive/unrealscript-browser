import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardOpenOption

plugins {
	id 'java'
	id 'application'
	id 'antlr'
	alias(libs.plugins.shadow)
}

group = 'org.unrealarchive'
version = "1.3"
application {
	mainClass = 'org.unrealarchive.scriptbrowser.Main'
}

repositories {
	mavenCentral()
}

dependencies {
	antlr(libs.antlr.core)

	implementation(libs.freemarker)

	testImplementation(libs.junit.jupiter)
	testRuntimeOnly(libs.junit.platform.launcher)
}

jar {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Main-Class': application.mainClass,
		)
	}
}

shadowJar {
	archiveClassifier.set('all')
	mergeServiceFiles()
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}

/**
 * Create list of static files, used for later extraction from the jar to disk.
 */
processResources.doLast {
	def wwwStaticDir = projectDir.toPath().resolve('src/main/resources/org/unrealarchive/scriptbrowser/www/static')
	def destFile = buildDir.toPath().resolve('resources/main/org/unrealarchive/scriptbrowser/www/static.list')
	def staticList = new StringBuilder()
	files { fileTree(wwwStaticDir).matching { exclude('**/*.xcf') } }.each {
		staticList.append(wwwStaticDir.getParent().relativize(it.toPath())).append("\t").append(it.lastModified()).append("\n")
	}
	Files.write(destFile, staticList.toString().replaceAll("\\\\", "/").getBytes(StandardCharsets.UTF_8),
			StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING)
}

test {
	useJUnitPlatform()
}
